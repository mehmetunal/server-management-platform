version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["xunit*", "NSubstitute", "Microsoft.NET.Test.Sdk", "Microsoft.AspNetCore.Mvc.Testing"]
      nuget-other:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/src/ServerManager.Web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/"
      - "/docker/e2e-ubuntu"
      - "/docker/ssh-docker-test"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
