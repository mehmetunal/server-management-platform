services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: server-manager-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasinda tanimlanmali}"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14340}:1433"
    volumes:
      - server-manager-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Uygulama: docker compose --profile app up -d --build
  # Gerekli .env değişkenleri: MSSQL_SA_PASSWORD, SM_MASTER_KEY (openssl rand -base64 32), ilk kurulum için SM_ADMIN_EMAIL / SM_ADMIN_PASSWORD.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mag-server-manager:local
    container_name: server-manager-app
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${SM_DB_NAME:-ServerManager};User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasinda tanimlanmali};TrustServerCertificate=True;Encrypt=True"
      Database__AutoCreate: "true"
      Security__MasterKey: "${SM_MASTER_KEY:?SM_MASTER_KEY .env dosyasinda tanimlanmali (openssl rand -base64 32)}"
      Seed__AdminEmail: "${SM_ADMIN_EMAIL:-}"
      Seed__AdminPassword: "${SM_ADMIN_PASSWORD:-}"
      Proxy__TrustForwardedHeaders: "${SM_TRUST_FORWARDED_HEADERS:-false}"
      Deployment__AcmeEmail: "${SM_ACME_EMAIL:-}"
      TZ: "${TZ:-Europe/Istanbul}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - server-manager-app-data:/app/App_Data
      - server-manager-app-logs:/app/logs
    restart: unless-stopped

  # Yalnızca yerel test: docker compose --profile test up -d ssh-docker-test
  ssh-docker-test:
    build: ./docker/ssh-docker-test
    container_name: sm-ssh-docker-test
    privileged: true
    profiles: ["test"]
    environment:
      SSH_TEST_PASSWORD: "${SSH_TEST_PASSWORD:?SSH_TEST_PASSWORD .env dosyasinda tanimlanmali}"
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:${SSH_TEST_PORT:-2223}:22"
    volumes:
      - sm-dind-data:/var/lib/docker

volumes:
  server-manager-db-data:
  server-manager-app-data:
  server-manager-app-logs:
  sm-dind-data:
